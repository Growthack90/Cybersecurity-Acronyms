name: JSON Validator & Duplicate Check

on:
  pull_request:
    paths:
      - '**.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check JSON Syntax
        run: |
          for file in $(find . -name "*.json"); do
            echo "Validando sintassi di $file..."
            python3 -m json.tool "$file" > /dev/null
          done

      - name: Check for Duplicate Acronyms
        run: |
          python3 -c "
          import json
          import sys

          try:
              with open('acronyms.json', 'r') as f:
                  data = json.load(f)
              
              acronyms = [item['acronym'].upper() for item in data]
              duplicates = set([x for x in acronyms if acronyms.count(x) > 1])
              
              if duplicates:
                  print(f'ERRORE: Acronimi duplicati trovati: {duplicates}')
                  sys.exit(1)
              else:
                  print('Nessun duplicato trovato. Ottimo!')
          except FileNotFoundError:
              print('File acronyms.json non trovato, salto il controllo duplicati.')
          "